name: Deploy to Cloudflare Workers

# Auto-deploys the built dashboard to Cloudflare Workers on every push to main.
# The repository owner only needs to add these two secrets once (Settings ->
# Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   (a token with "Edit Cloudflare Workers" permission)
#   CLOUDFLARE_ACCOUNT_ID  (found on the Cloudflare dashboard home)
# After that, every merge to main ships automatically — no manual steps.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
