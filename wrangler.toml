name = "newstracker"
main = "worker/index.ts"
compatibility_date = "2024-11-01"

# Build the site before deploying. This runs automatically on `wrangler deploy`
# (locally AND in Cloudflare Workers Builds), so the connected-repo deploy needs
# no separate "build command" configured in the dashboard.
[build]
command = "npm run build"

# Serve the built Vite site (dist/) as static assets. The Worker is the entry
# point (see main above) so that /api/* routes can be added in later prompts.
[assets]
directory = "./dist"
binding = "ASSETS"
# Fall back to index.html for unknown paths (single-page app behaviour).
not_found_handling = "single-page-application"

# KV "memory" for the add-keyword / add-stock boxes and email subscriptions,
# which the scraper also reads (/api/custom, /api/subscribe).
[[kv_namespaces]]
binding = "NEWSFLOW_KV"
id = "b5876a0f652543ab82dccd2b3464896c"

# NOTE: the hourly digest is triggered by GitHub Actions (.github/workflows/
# send-digests.yml), which POSTs to /api/run-digests every hour. That keeps the
# feature fully automated WITHOUT consuming a Cloudflare cron slot — the Workers
# Free plan caps the whole account at 5 cron triggers, and this account is at
# that limit. The Worker still ships a scheduled() handler, so if the account is
# ever upgraded you can re-enable a native trigger by uncommenting:
#   [triggers]
#   crons = ["0 * * * *"]
