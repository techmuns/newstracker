name = "newstracker"
main = "worker/index.ts"
compatibility_date = "2024-11-01"

# Build the site before deploying. This runs automatically on `wrangler deploy`
# (locally AND in Cloudflare Workers Builds), so the connected-repo deploy needs
# no separate "build command" configured in the dashboard.
[build]
command = "npm run build"

# Serve the built Vite site (dist/) as static assets. The Worker is the entry
# point (see main above) so that /api/* routes can be added in later prompts.
[assets]
directory = "./dist"
binding = "ASSETS"
# Fall back to index.html for unknown paths (single-page app behaviour).
not_found_handling = "single-page-application"

# KV "memory" for the add-keyword / add-stock boxes (Prompt 3), which the
# scraper also reads. ONE-TIME setup (then automatic forever):
#   npx wrangler kv namespace create NEWSFLOW_KV
# Paste the printed id below and UNCOMMENT these three lines, then push.
# Until configured, the Worker's /api/custom returns empty and the add-boxes
# fall back to localStorage — so leaving this commented never breaks the deploy.
# [[kv_namespaces]]
# binding = "NEWSFLOW_KV"
# id = "<paste-the-id-here>"

# Hourly cron (Prompt 4): the Worker's scheduled() handler emails due
# subscribers their newspaper digest once per day at their chosen IST hour.
# (Registered automatically by the connected Workers Build on deploy.)
[triggers]
crons = ["0 * * * *"]
